<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>
      <div class="header-title">
        <ion-icon name="leaf"></ion-icon>
        Dashboard
      </div>
    </ion-title>
  </ion-toolbar>
  <ion-toolbar color="primary" class="search-toolbar">
    <ion-searchbar
      placeholder="Cari judul atau lokasi..."
      [(ngModel)]="searchQuery"
      (ionInput)="onSearch()"
      [debounce]="300"
      mode="ios">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="notes-container">
    <div class="note-card" *ngFor="let note of filteredNotes" (click)="viewDetail(note.id)">
      <div class="card-image">
        <img *ngIf="note.imagePath" [src]="note.imagePath" alt="">
        <div *ngIf="!note.imagePath" class="card-image-placeholder">
          <ion-icon name="image-outline"></ion-icon>
        </div>
        <span class="category-badge" [style.background-color]="getCategoryColor(note.category)">
          {{ note.category }}
        </span>
      </div>
      <div class="card-content">
        <h3>{{ note.title }}</h3>
        <p class="location">Lokasi: {{ note.location }}</p>
        <p class="date">Tanggal: {{ formatDate(note.date) }}</p>
        <p class="description">{{ note.description }}</p>
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredNotes.length === 0">
      <ion-icon name="leaf-outline"></ion-icon>
      <h3>Belum ada catatan</h3>
      <p>Tap tombol + untuk mulai mencatat petualangan alam Anda</p>
    </div>
  </div>

</ion-content>
